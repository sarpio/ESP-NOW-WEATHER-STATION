; CYD 4.0" – ESP32-3248S040 (ESP32-D0WD-V3, 4 MB flash, bez PSRAM),
; ST7796 480x320 + dotyk XPT2046 na wspólnym HSPI, USB-UART (CH340) na /dev/ttyUSB0.
; Piny płytki: src/lgfx_config.h (zgodne z ../CYD/include/cyd_config.h)
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 3 MB na aplikację, ok. 900 KB na LittleFS (historia zajmuje ok. 48 KB), bez OTA
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs ; historia odczytów (src/history.cpp)
build_flags =
  -I../common
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  lovyan03/LovyanGFX@^1.2.7
