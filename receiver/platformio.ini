; ESP32-S3 N16R8 (16 MB flash QIO, 8 MB PSRAM OPI), podłączony przez natywny port USB (USB-Serial/JTAG)
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -I../common
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  lovyan03/LovyanGFX@^1.2.7
